<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<meta name="description" content="@@DESC@@">
<link rel="canonical" href="@@CANONICAL@@">
<meta name="color-scheme" content="dark light">
<meta property="og:title" content="@@TITLE@@">
<meta property="og:description" content="@@DESC@@">
<meta property="og:type" content="website">
<script>
// set theme class before paint (no flash); respects stored choice, then OS
(function(){try{var t=localStorage.getItem('kakashi-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}else if(matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.setAttribute('data-theme','light')}}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/code.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='3' font-size='26'%3E%F0%9F%AB%B6%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/">kakashi<span class="mask">🪶</span></a>
  <button class="theme-toggle" id="themeToggle" aria-label="toggle color theme" title="toggle theme">◐</button>
</header>
<main>
@@BODY@@
</main>
<footer class="site-footer">
  <span>built @@BUILT@@ · hosted on the box</span>
</footer>
<script>
(function(){
  var b=document.getElementById('themeToggle');
  if(b)b.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    document.documentElement.setAttribute('data-theme',cur);
    try{localStorage.setItem('kakashi-theme',cur)}catch(e){}
  });
})();
</script>
</body>
</html>
