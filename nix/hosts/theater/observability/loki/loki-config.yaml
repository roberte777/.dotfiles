# Single-binary mode: one host, filesystem storage, no clustering.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Generous on purpose: the point is to still be ingesting when something goes
  # wrong, not to shed exactly the logs that explain it.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

  # 30 days. Journald is capped at 2G; Loki holds the longer history.
  retention_period: 720h

  reject_old_samples: true
  reject_old_samples_max_age: 168h

  max_query_series: 10000
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  # Without these three, retention_period is silently a no-op and the disk grows
  # forever -- the exact failure this stack exists to catch.
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  # Unset until alert rules exist -- pointing at a missing Alertmanager just
  # produces its own error spam.
  # alertmanager_url: http://ntfy:8085

analytics:
  reporting_enabled: false
