services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # No SERVER_HOSTNAMES pin here. The old pin worked around a NordVPN OpenVPN
      # quirk: gluetun would latch onto one endpoint that rejected auth and retry
      # it forever. Proton WireGuard authenticates with a key rather than
      # per-server credentials, so a bad-endpoint pick is not sticky in the same
      # way and the workaround no longer earns its keep.
      #
      # Restricts server selection to Proton endpoints that support port
      # forwarding, which is the same set as its P2P servers -- gluetun has no
      # SERVER_FEATURES variable, so this is how "P2P only" is expressed. Without
      # it, gluetun can pick a non-P2P server, connect fine, and then silently
      # fail to obtain a forwarded port.
      #
      # Note this narrows the pool for EVERY service on this tunnel, not just the
      # MAM client. That is the accepted cost of keeping MyAnonaMouse on a single
      # exit IP: MAM binds the session to one IP and rejects a torrent client that
      # announces from a different one than the indexer browses from, so prowlarr
      # and qbittorrent-mam must share this namespace.
      - PORT_FORWARD_ONLY=on
      # Actually requests the forwarded port over NAT-PMP. The certificate must
      # have been generated with NAT-PMP enabled in the Proton dashboard; that is
      # baked into the cert and cannot be toggled afterwards.
      - VPN_PORT_FORWARDING=on
      # Proton issues a new forwarded port on every reconnect, so qBittorrent's
      # listen port cannot be hardcoded -- it would silently stop being
      # connectable after the first reconnect. gluetun substitutes {{PORT}} and
      # runs this once the port is up, pushing it into qBittorrent's API.
      #
      # Targets 8084 (qbittorrent-mam's WEBUI_PORT), NOT 8081 -- the forwarded
      # port belongs to the MAM client. Requires that client's "Bypass
      # authentication for clients on localhost" to be enabled.
      #
      # MAM blacklists the common BitTorrent ports (6881-6889) and other p2p
      # ports; Proton's NAT-PMP assignments land well outside that range, so the
      # dynamic port is safe to use as-is.
      # The whole shell script must be ONE argument to `sh -c`, hence the single
      # quotes: without them sh runs `wget` alone and treats the rest as
      # positional parameters, failing with "wget: missing URL".
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8084/api/v2/app/setPreferences'
      #
      # Refresh the ProtonVPN server list every 20 days. Defaults to 0 (disabled),
      # which lets the list bundled in the image drift out of date as the provider
      # rotates endpoints. Writes into the persisted /gluetun mount below.
      # Do not go below 360h: more frequent polling spams the provider's API and
      # risks getting the updater blocked.
      - UPDATER_PERIOD=480h
      - UPDATER_VPN_SERVICE_PROVIDERS=protonvpn
    volumes:
      # Persists /gluetun/servers/manifest.json across image updates. The image
      # ships a server list baked in at build time; the provider rotates endpoints,
      # and a stale list makes gluetun dial a decommissioned server, which fails to
      # connect and looks like a bad key. Without this mount, watchtower's nightly
      # pull reverts the refreshed list.
      - ${APPDATA_DIR}/gluetun:/gluetun
    ports:
      # qBittorrent WebUI (qbit listens on 8080 in its container)
      - "8081:8081"
      # Prowlarr UI
      - "9696:9696"
      # SABnzbd UI
      - "8080:8080"
      # qbittorrent-mam WebUI
      - "8084:8084"
      # MouseHole UI
      - "5010:5010"
    restart: unless-stopped

  # Dedicated qBittorrent for MyAnonaMouse, separate from the general-purpose
  # qbittorrent above so its version can be pinned and its settings tuned to
  # MAM's rules without affecting the rest of the stack.
  #
  # VERSION IS PINNED DELIBERATELY -- DO NOT CHANGE TO :latest.
  # MAM only permits qBittorrent 5.0.1 through the 5.2.x line, and its rules
  # require auto-update to be disabled. watchtower pulls :latest nightly across
  # this stack, so a floating tag would eventually upgrade this client past 5.2.x
  # and trip "Unauthorized Client" with no warning. The label below also excludes
  # it from watchtower as a second layer of defence.
  # Before bumping this pin, confirm the target version is still on MAM's
  # allowed-clients list.
  qbittorrent-mam:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
    container_name: qbittorrent-mam
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8084
    labels:
      # Keep watchtower away from the pinned MAM client.
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - ${APPDATA_DIR}/qbittorrent-mam:/config
      - ${DATA_DIR}/torrents:/data/torrents
    restart: unless-stopped

  # Keeps the MAM session pointed at the current VPN exit IP. MAM requires the
  # torrent client and the session to come from the same IP; because this client
  # egresses through gluetun while you browse the site from the house connection,
  # the two differ and MAM would otherwise reject the client with "Unrecognized
  # host/PassKey" whenever Proton moves us to a new endpoint.
  #
  # Shares the gluetun namespace on purpose -- it must report the SAME exit IP
  # that qbittorrent-mam and prowlarr use, so it cannot run outside the tunnel.
  # This is also why MAM lives on the main tunnel rather than a second one: the
  # indexer, the client and this updater all have to agree on one IP.
  #
  # The MAM cookie is pasted into the web UI at http://<host>:5010 after startup;
  # it is not supplied via environment variable.
  mousehole:
    image: tmmrtn/mousehole:latest
    container_name: mousehole
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ}
      - MOUSEHOLE_AUTH_PASSWORD=${MOUSEHOLE_AUTH_PASSWORD}
      # Needed because the UI is reached over the LAN rather than localhost.
      - MOUSEHOLE_ALLOWED_HOSTS=${MOUSEHOLE_ALLOWED_HOSTS}
    volumes:
      - ${APPDATA_DIR}/mousehole:/var/lib/mousehole
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8081
    volumes:
      - ${APPDATA_DIR}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:amd64-latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  # radarr/sonarr remain normal (no VPN), as before:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ${APPDATA_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ${APPDATA_DIR}/plex:/config
      - ${DATA_DIR}/media:/data/media
      - /tmp/plex:/transcode
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    ports:
      - "8181:8181"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/tautulli:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    ports:
      - "5055:5055"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/seerr:/app/config
    restart: unless-stopped

  seerr-plex:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr-plex
    ports:
      - "5056:5055"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_DIR}/seerr-plex:/app/config
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/sabnzbd:/config
      - ${DATA_DIR}/usenet:/data/usenet
    restart: unless-stopped

  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:latest
    container_name: shelfarr
    ports:
      - "8082:8082"
    environment:
      - SOLID_QUEUE_IN_PUMA=1
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HTTP_PORT=8082
    volumes:
      - ${APPDATA_DIR}/shelfarr:/rails/storage
      # Single /data mount (TRaSH-style) so paths reported by qBittorrent and
      # SABnzbd resolve identically inside shelfarr and hardlinks/atomic moves work.
      - ${DATA_DIR}:/data
    restart: unless-stopped

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    ports:
      - "6868:6868"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/profilarr:/config
    restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    ports:
      - "7575:7575"
    environment:
      - TZ=${TZ}
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ${APPDATA_DIR}/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  kasm:
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    privileged: true
    ports:
      - "3001:3000"
      - "3002:3001"
      - "443:443"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/kasm:/config
      - /dev/shm:/dev/shm
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA_DIR}/portainer:/data
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    ports:
      - "8083:80"
    environment:
      - TZ=${TZ}
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
    volumes:
      - ${APPDATA_DIR}/vaultwarden:/data
    restart: unless-stopped

  # Maintained fork, NOT containrrr/watchtower -- the original was abandoned in
  # 2023 and its last image speaks Docker API 1.25. Docker 29 raised the minimum
  # to 1.40, so containrrr now fails every cycle with "client version 1.25 is too
  # old" and restart:unless-stopped turns that into a crash loop. Re-pulling
  # :latest does not help; there is no newer containrrr build to get.
  # The fork keeps the WATCHTOWER_* variables and the com.centurylinklabs.*
  # labels, so the exclusion on qbittorrent-mam still applies.
  # There is no per-container interval label -- the schedule belongs to the
  # watchtower process, so a container that needs different timing needs its own
  # instance. Hence two: this one nightly for the stack, and watchtower-fast
  # below on a short cycle for omnibus.
  #
  # Deliberately left UNSCOPED. An unscoped instance manages exactly those
  # containers that carry no scope label, and skips scoped ones -- so it keeps
  # picking up every service in this file automatically, while omnibus (labelled
  # into omnibus-fast) is handed off to the other instance with no race. Setting a
  # scope here would silently orphan all ~20 unlabelled services.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
    restart: unless-stopped

  # Fast-cycle instance for omnibus only. Scoped, so it ignores every container
  # that does not carry the matching scope label.
  #
  # Hourly is the floor worth using: registry pulls are rate limited and anonymous
  # Docker Hub requests get throttled if polled harder, which would break BOTH
  # instances rather than just this one.
  watchtower-fast:
    image: nickfedor/watchtower:latest
    container_name: watchtower-fast
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 * * * *
      - WATCHTOWER_SCOPE=omnibus-fast
    # No scope label on purpose: this container stays unscoped so the nightly
    # instance above keeps its image updated. WATCHTOWER_SCOPE sets what this
    # instance *watches*; it does not label the container itself.
    restart: unless-stopped

  omnibus:
    image: sesloan/omnibus:latest
    container_name: omnibus
    labels:
      # Hands this container to watchtower-fast (hourly) instead of the nightly
      # instance. Safe to cycle often because omnibus is standalone -- own bridge
      # network, own port, nothing shares its namespace -- so a bad pull affects
      # only omnibus.
      - com.centurylinklabs.watchtower.scope=omnibus-fast
    ports:
      - "3000:3000"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OMNIBUS_PUBLIC_ORIGIN=${OMNIBUS_PUBLIC_ORIGIN}
      - OMNIBUS_SECURE_COOKIES=0
      - EBOOK_LIBRARY_PATH=/books
      - AUDIOBOOK_LIBRARY_PATH=/audiobooks
      - RUST_LOG=omnibus=debug,tower_http=debug,info
    volumes:
      - ${APPDATA_DIR}/omnibus/config:/config
      - ${APPDATA_DIR}/omnibus/cache:/cache
      - ${DATA_DIR}/media/books:/books
      - ${DATA_DIR}/media/audiobooks:/audiobooks
    restart: unless-stopped
