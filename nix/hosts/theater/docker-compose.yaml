services:
  gluetun:
    # v3, NOT latest -- :latest tracks the dev branch and rebuilds nightly, so
    # watchtower recreated the tunnel (and all six containers sharing its
    # namespace) every day. :v3 still gets patch updates.
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # Pinned to endpoints whose exit ASN is on the MAM session allow-list
      # (9009 / 60068 / 63023 / 199218); otherwise a reconnect lands on a
      # disallowed ASN and MAM fails with "Invalid session - ASN mismatch",
      # needing a manual IP re-add. Must be hostname-level: Proton's cities
      # straddle multiple ASNs. All 32 kept deliberately, to preserve failover.
      # Proton renumbers nodes -- if MAM starts rejecting, re-derive with:
      #   scripts/mam-allowed-vpn-hosts.sh
      - SERVER_HOSTNAMES=node-us-126.protonvpn.net,node-us-127.protonvpn.net,node-us-130.protonvpn.net,node-us-144.protonvpn.net,node-us-171.protonvpn.net,node-us-176.protonvpn.net,node-us-181.protonvpn.net,node-us-183.protonvpn.net,node-us-189.protonvpn.net,node-us-190.protonvpn.net,node-us-195.protonvpn.net,node-us-197.protonvpn.net,node-us-208.protonvpn.net,node-us-212.protonvpn.net,node-us-215b.protonvpn.net,node-us-221.protonvpn.net,node-us-237.protonvpn.net,node-us-238.protonvpn.net,node-us-256.protonvpn.net,node-us-259.protonvpn.net,node-us-260.protonvpn.net,node-us-261.protonvpn.net,node-us-300.protonvpn.net,node-us-311.protonvpn.net,node-us-312.protonvpn.net,node-us-313.protonvpn.net,node-us-371.protonvpn.net,node-us-372.protonvpn.net,node-us-58.protonvpn.net,node-us-69.protonvpn.net,node-us-74.protonvpn.net,node-us-93.protonvpn.net
      #
      # How "P2P only" is expressed -- gluetun has no SERVER_FEATURES variable,
      # and Proton's port-forward servers are the same set as its P2P ones.
      # Without it gluetun can pick a non-P2P server, connect fine, and silently
      # never get a forwarded port. Narrows the pool for every service on this
      # tunnel: the accepted cost of MAM needing one shared exit IP.
      - PORT_FORWARD_ONLY=on
      # The cert must have been generated with NAT-PMP enabled in the Proton
      # dashboard -- that is baked in and cannot be toggled afterwards.
      - VPN_PORT_FORWARDING=on
      # Proton issues a new port on every reconnect, so the listen port cannot be
      # hardcoded; gluetun substitutes {{PORT}} and pushes it into qBittorrent.
      # Targets 8084 (qbittorrent-mam), NOT 8081 -- the forwarded port belongs to
      # the MAM client, which needs "Bypass authentication for localhost" on.
      # Single quotes are required: the script must be ONE argument to `sh -c`,
      # otherwise sh runs `wget` alone and fails with "wget: missing URL".
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -qO- --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8084/api/v2/app/setPreferences'
      # Refresh the server list every 20 days; defaults to 0 (disabled), letting
      # the image's bundled list drift as Proton rotates endpoints. Do not go
      # below 360h -- harder polling risks the updater being blocked.
      - UPDATER_PERIOD=480h
      - UPDATER_VPN_SERVICE_PROVIDERS=protonvpn
    volumes:
      # Persists the refreshed server list across image updates -- without it
      # watchtower's pull reverts to the stale baked-in one, and gluetun dials a
      # decommissioned server, which looks like a bad key.
      - ${APPDATA_DIR}/gluetun:/gluetun
    ports:
      # qBittorrent WebUI (qbit listens on 8080 in its container)
      - "8081:8081"
      # Prowlarr UI
      - "9696:9696"
      # SABnzbd UI
      - "8080:8080"
      # qbittorrent-mam WebUI
      - "8084:8084"
      # MouseHole UI
      - "5010:5010"
    restart: unless-stopped

  # Dedicated qBittorrent for MyAnonaMouse, kept separate from the general-purpose
  # one so it can be pinned and tuned to MAM's rules independently.
  #
  # VERSION IS PINNED DELIBERATELY -- DO NOT CHANGE TO :latest. MAM only permits
  # qBittorrent 5.0.1 through 5.2.x, so a floating tag would eventually upgrade
  # past that and trip "Unauthorized Client" with no warning. Before bumping,
  # confirm the target version is still on MAM's allowed-clients list.
  qbittorrent-mam:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls469
    container_name: qbittorrent-mam
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8084
    labels:
      # monitor-only, NOT enable=false. Both hold the pin, but enable=false hides
      # this container from the pass that recreates everything sharing gluetun's
      # namespace, stranding it on a destroyed one (see sabnzbd).
      - com.centurylinklabs.watchtower.monitor-only=true
      # See sabnzbd. Visibility alone is not a dependency -- this is what
      # actually ties it to gluetun.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    volumes:
      - ${APPDATA_DIR}/qbittorrent-mam:/config
      - ${DATA_DIR}/torrents:/data/torrents
    # Makes a stranded-namespace failure visible: the process keeps running with
    # a socket open on 8084, so `docker ps` reports "Up" indefinitely while the
    # UI is unreachable. Probing the WebUI catches that; a liveness check cannot.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:8084"]
      interval: 60s
      timeout: 10s
      # Generous: qBittorrent rechecks torrents on start, and too low here would
      # flap the container on every restart.
      start_period: 180s
      retries: 3
    restart: unless-stopped

  # Keeps the MAM session pointed at the current VPN exit IP; without it MAM
  # rejects the client with "Unrecognized host/PassKey" whenever Proton moves to
  # a new endpoint. Shares the gluetun namespace on purpose -- it must report the
  # SAME exit IP as qbittorrent-mam and prowlarr, which is also why MAM lives on
  # the main tunnel rather than a second one.
  #
  # The MAM cookie is pasted into the web UI at http://<host>:5010 after startup,
  # not supplied via environment variable.
  mousehole:
    image: tmmrtn/mousehole:latest
    container_name: mousehole
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ}
      - MOUSEHOLE_AUTH_PASSWORD=${MOUSEHOLE_AUTH_PASSWORD}
      # Needed because the UI is reached over the LAN rather than localhost.
      - MOUSEHOLE_ALLOWED_HOSTS=${MOUSEHOLE_ALLOWED_HOSTS}
    labels:
      # See sabnzbd -- recreates this alongside gluetun rather than stranding it.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    volumes:
      - ${APPDATA_DIR}/mousehole:/var/lib/mousehole
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8081
    labels:
      # See sabnzbd -- recreates this alongside gluetun rather than stranding it.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    volumes:
      - ${APPDATA_DIR}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:amd64-latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    labels:
      # See sabnzbd -- recreates this alongside gluetun rather than stranding it.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    volumes:
      - ${APPDATA_DIR}/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ}
    labels:
      # See sabnzbd -- recreates this alongside gluetun rather than stranding it.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    restart: unless-stopped

  # radarr/sonarr remain normal (no VPN), as before:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports: ["7878:7878"]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    volumes:
      - ${APPDATA_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports: ["8989:8989"]
    environment: ["PUID=${PUID}", "PGID=${PGID}", "TZ=${TZ}"]
    volumes:
      - ${APPDATA_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    volumes:
      - ${APPDATA_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ${APPDATA_DIR}/plex:/config
      - ${DATA_DIR}/media:/data/media
      - /tmp/plex:/transcode
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    ports:
      - "8181:8181"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/tautulli:/config
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    ports:
      - "5055:5055"
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/seerr:/app/config
    restart: unless-stopped

  seerr-plex:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr-plex
    ports:
      - "5056:5055"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_DIR}/seerr-plex:/app/config
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    labels:
      # Canonical note for the depends-on labels on every container sharing this
      # namespace. Watchtower recreates this whenever it replaces gluetun.
      # Without it, sabnzbd stays attached to the destroyed namespace: `docker ps`
      # shows it Up, but published 8080 forwards into the NEW namespace where
      # nothing listens, and Radarr fails every grab with "Broken pipe" while
      # search still works -- reading like an indexer fault, not a client one.
      #
      # depends_on does NOT cover this; it only orders startup. network_mode is
      # an implicit link, but watchtower stores it as a container ID and must
      # inspect it to recover the name -- which fails once that container is
      # gone, exactly the stranded case. This label is a plain name, so it
      # survives.
      - com.centurylinklabs.watchtower.depends-on=gluetun
    volumes:
      - ${APPDATA_DIR}/sabnzbd:/config
      - ${DATA_DIR}/usenet:/data/usenet
    restart: unless-stopped

  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:latest
    container_name: shelfarr
    ports:
      - "8082:8082"
    environment:
      - SOLID_QUEUE_IN_PUMA=1
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HTTP_PORT=8082
    volumes:
      - ${APPDATA_DIR}/shelfarr:/rails/storage
      # Single /data mount (TRaSH-style) so paths reported by qBittorrent and
      # SABnzbd resolve identically inside shelfarr and hardlinks/atomic moves work.
      - ${DATA_DIR}:/data
    restart: unless-stopped

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    ports:
      - "6868:6868"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/profilarr:/config
    restart: unless-stopped

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    ports:
      - "7575:7575"
    environment:
      - TZ=${TZ}
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ${APPDATA_DIR}/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  kasm:
    image: lscr.io/linuxserver/kasm:latest
    container_name: kasm
    privileged: true
    ports:
      - "3001:3000"
      - "3002:3001"
      - "443:443"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/kasm:/config
      - /dev/shm:/dev/shm
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA_DIR}/portainer:/data
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    ports:
      - "8083:80"
    environment:
      - TZ=${TZ}
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
    volumes:
      - ${APPDATA_DIR}/vaultwarden:/data
    restart: unless-stopped

  # Maintained fork, NOT containrrr/watchtower -- the original was abandoned in
  # 2023 and speaks Docker API 1.25, below the 1.40 minimum Docker 29 requires,
  # so it crash-loops. No newer containrrr build exists. The fork keeps the
  # WATCHTOWER_* variables and com.centurylinklabs.* labels.
  #
  # Two instances because the schedule belongs to the process, not a per-container
  # label: this one nightly for the stack, watchtower-fast below for omnibus.
  #
  # Scope "none" means the unlabelled containers, and is NOT the same as unset --
  # unset would claim omnibus and delete watchtower-fast as a duplicate.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_SCOPE=none
    restart: unless-stopped

  # Fast-cycle instance for omnibus only; scoped, so it ignores anything without
  # the matching label. Hourly is the floor -- polling harder gets anonymous
  # Docker Hub requests throttled, which would break BOTH instances.
  watchtower-fast:
    image: nickfedor/watchtower:latest
    container_name: watchtower-fast
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 * * * *
      - WATCHTOWER_SCOPE=omnibus-fast
    labels:
      # Puts this instance in its own scope -- the env var above only sets what it
      # watches. Unlabelled it lands in scope "none" and the nightly instance
      # deletes it as a duplicate. Cost: it now self-updates hourly.
      - com.centurylinklabs.watchtower.scope=omnibus-fast
    restart: unless-stopped

  # Push-notification server; the phone subscribes to a topic and anything that
  # POSTs to it pushes through. Reached over Tailscale, so no port forward.
  # BASE_URL must be the tailnet address -- ntfy hands that URL to clients for
  # attachments and click actions, and a LAN IP silently fails from outside.
  #
  # The topic name is the ONLY secret on an unauthenticated instance, which is
  # acceptable only because the tailnet is the boundary -- do not expose 8085
  # publicly without turning on auth.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    environment:
      - TZ=${TZ}
      - NTFY_BASE_URL=${NTFY_BASE_URL}
      - NTFY_LISTEN_HTTP=:8085
      # Without a cache file ntfy holds messages in memory only, so a restart
      # drops anything an offline phone had not yet received.
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=12h
      # Keeps the iOS app awake. Without it iOS tears the connection down and
      # alerts arrive late or not at all -- the usual cause of self-hosted ntfy
      # looking broken on iPhone.
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    volumes:
      - ${APPDATA_DIR}/ntfy/cache:/var/cache/ntfy
      - ${APPDATA_DIR}/ntfy/etc:/etc/ntfy
    ports:
      - "8085:8085"
    restart: unless-stopped

  # Decides WHEN to notify: runs the HTTP probes and calls ntfy when one fails.
  # The docker socket is only for the "Docker Container" monitor type, and is
  # read-only -- it never needs to start or stop anything.
  # Host port 3003 because omnibus owns 3000 and kasm owns 3001/3002.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    environment:
      - TZ=${TZ}
    volumes:
      - ${APPDATA_DIR}/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3003:3001"
    restart: unless-stopped

  omnibus:
    image: sesloan/omnibus:latest
    container_name: omnibus
    labels:
      # Hands this to watchtower-fast (hourly). Safe to cycle often because
      # omnibus is standalone -- nothing shares its namespace, so a bad pull
      # affects only omnibus.
      - com.centurylinklabs.watchtower.scope=omnibus-fast
    ports:
      - "3000:3000"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OMNIBUS_PUBLIC_ORIGIN=${OMNIBUS_PUBLIC_ORIGIN}
      - OMNIBUS_SECURE_COOKIES=0
      - EBOOK_LIBRARY_PATH=/books
      - AUDIOBOOK_LIBRARY_PATH=/audiobooks
      - RUST_LOG=omnibus=debug,tower_http=debug,info
    volumes:
      - ${APPDATA_DIR}/omnibus/config:/config
      - ${APPDATA_DIR}/omnibus/cache:/cache
      - ${DATA_DIR}/media/books:/books
      - ${DATA_DIR}/media/audiobooks:/audiobooks
    restart: unless-stopped

  # --- Observability -------------------------------------------------------
  # Docker uses the journald log driver, so Alloy reads every container's stdout
  # from the journal. No logging config on any other service.

  loki:
    # Pinned: Loki has schema changes between minors, and an unattended bump
    # needing a migration would take logging down unnoticed.
    image: grafana/loki:3.7.6
    container_name: loki
    user: "${PUID}:${PGID}"
    ports:
      # localhost only -- no auth, and it holds everything the stack logs.
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ${APPDATA_DIR}/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${APPDATA_DIR}/loki/data:/loki
    restart: unless-stopped

  # Metrics half of the observability stack -- Loki says what containers logged,
  # this says what the machine and each container are actually doing. See
  # docs/SHELFARR_HEALTHCHECK_CHAINS.md for why both are needed.
  prometheus:
    # Pinned: retention and TSDB format are on-disk state, and an unattended
    # major bump is not something to discover during an incident.
    image: prom/prometheus:v3.7.3
    container_name: prometheus
    user: "${PUID}:${PGID}"
    ports:
      # localhost only -- no auth, same reasoning as Loki. Grafana reaches it
      # over the compose network.
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 90 days: long enough to answer "when did this start" for a slow leak.
      # A couple of GB here, well under the NVMe headroom.
      - --storage.tsdb.retention.time=90d
      # Lets Grafana deep-link into the Prometheus UI correctly if ever needed.
      - --web.enable-lifecycle
    # node-exporter is on the host network, so it has no container name to
    # resolve. Avoids hardcoding 172.18.0.1, which moves if the network is recreated.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA_DIR}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${APPDATA_DIR}/prometheus/data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
    restart: unless-stopped

  # Host-level metrics. The broad host mounts, host PID and host network are the
  # job: it reads /proc and /sys for the real host, not the container's
  # namespaced view. All read-only -- it never writes anything.
  node-exporter:
    image: prom/node-exporter:v1.10.1
    container_name: node-exporter
    pid: host
    network_mode: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Without this every container overlay and bind mount shows up as its own
      # filesystem, burying the three that matter (/, /boot, /mnt/bay1).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$
      - --collector.hwmon
      # hwmon covers CPU/NVMe/wifi but NOT the SATA spinner -- that temperature
      # only exists over SMART, which needs root, so the smart-textfile systemd
      # timer writes it here as a .prom file instead.
      - --collector.textfile
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/lib/node-exporter/textfile:/var/lib/node-exporter/textfile:ro
    restart: unless-stopped

  # Per-container CPU/memory/network/IO. This is what turns "something is
  # leaking" into "shelfarr is leaking".
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    ports:
      # localhost only; Prometheus scrapes it over the compose network.
      - "127.0.0.1:8086:8080"
    # All read-only; cadvisor needs these to read cgroup accounting for every
    # container.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # Maps cgroup ids to container names. Without it every series comes back as
      # id="/" with no name label, making per-container attribution -- the entire
      # reason for running cadvisor -- impossible.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    devices:
      - /dev/kmsg
    privileged: true
    command:
      # Only the metrics the scrape config keeps; disabling the rest at source
      # is cheaper than dropping them after transfer.
      - --housekeeping_interval=15s
      - --docker_only=true
      - --store_container_labels=false
      # NixOS puts containerd's socket here, not the /run/containerd default
      # cadvisor compiles in. Without this the docker factory fails to register
      # and it silently falls back to Raw, producing the same unusable id="/"
      # series as above while scrapes still look healthy.
      - --containerd=/var/run/docker/containerd/containerd.sock
    restart: unless-stopped

  alloy:
    # Pinned so a watchtower bump cannot silently change the collector.
    image: grafana/alloy:v1.19.0
    container_name: alloy
    ports:
      - "127.0.0.1:12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      # Not the default /var/lib/alloy/data: that parent is baked in as 0770 uid
      # 473, so a PUID container cannot traverse it to reach a volume mounted
      # underneath. Fails as "mkdir ... permission denied" naming the child.
      - --storage.path=/alloy-data
      - /etc/alloy/config.alloy
    volumes:
      - ${APPDATA_DIR}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${APPDATA_DIR}/alloy/data:/alloy-data
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    # PUID to own the state dir, systemd-journal as a supplementary group to read
    # the journal. gid 62 here; `getent group systemd-journal` to confirm.
    user: "${PUID}:${PGID}"
    group_add:
      - "62"
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    # Image defaults to uid 472, which cannot write a PUID-owned appdata dir.
    user: "${PUID}:${PGID}"
    ports:
      # 3000-3003 are omnibus, kasm x2, uptime-kuma.
      - "3004:3000"
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_EXPLORE_ENABLED=true
    volumes:
      - ${APPDATA_DIR}/grafana/data:/var/lib/grafana
      - ${APPDATA_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    restart: unless-stopped
